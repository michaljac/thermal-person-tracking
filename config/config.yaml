
paths:
  input_video: "videos/input/input_h264.mp4"
  model: "models/best_uav_fast_640x384.onnx"
  output_dir: "videos/output"
  # Previous baseline: "models/best_uav_fast.onnx" with image_size 512 (square)
  #"models/hae-s-ir_lwir.onnx" / "models/best_uav_fast.pt"

detector:
  # yolo
  confidence_threshold: 0.3 #0.15
  # Static ONNX models must use the exact export size: [height, width].
  # 640x384 keeps the portrait video's aspect ratio (no square padding).
  image_size: [640, 384]
  classes: [0]
  device: "cpu"

  # hae-s-ir
  hae-s-ir_confidence_threshold: 0.5 #0.3
  hae-s-ir_image_size: 1024 # longer frame side after resize; null = use hae_scale
  hae_scale: 1.0 # only used when hae-s-ir_image_size is null

preprocessing:
  mode: "none" # none | clahe | inverted | clahe_inverted
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: [8, 8]

video:
  default_fps: 30.0
  output_codec: "mp4v"

visualization:
  bbox_color: [255, 0, 0]
  bbox_thickness: 2
  font_scale: 0.6
  text_thickness: 2

run:
  # Quick test: process only the first `test_num_frames` frames.
  # Set test_mode: false to process the whole video.
  test_mode: true
  test_num_frames: 50

profiling:
  enabled: true
  warmup_frames: 10

preview:
  num_frames: 6
  frames_per_row: 3
  frame_width: 500
  gap: 10
  min_frame_gap: 15

tracker:
  type: "botsort" # botsort | deepsort

  # BoT-SORT: camera-motion compensation + two-stage matching, no appearance model.
  # The detector's confidence_threshold must be <= track_low_thresh,
  # otherwise the low-score second stage receives nothing.
  botsort:
    track_high_thresh: 0.3 # first-stage matching + drawn detections
    track_low_thresh: 0.1 # second stage: low scores may only extend existing tracks
    new_track_thresh: 0.5 # minimum score to START a track (0.3 -> 13 IDs, 0.5 -> 9 IDs)
    min_hits: 3 # report a track only after 3 matches (like DeepSORT n_init)
    match_buffer: 1.0 # buffered IoU: enlarge boxes x3 for matching (tiny targets)
    track_buffer: 90 # frames to keep a lost track (3 s at 30 FPS)
    match_thresh: 0.8 # max IoU-cost to accept a match
    fuse_score: true # combine IoU with detection score
    gmc_method: "sparseOptFlow" # camera-motion compensation: sparseOptFlow | orb | none
    gmc_downscale: 4 # estimate camera motion on a 1/4-size frame (2 = Ultralytics default, ~2x slower)

  # DeepSORT (previous tracker; Kalman + MobileNetV2 appearance + IoU)
  deepsort:
    max_age: 100 # max number of frame to keep inactive object data
    n_init: 3 # min number of detected object before open track
    max_iou_distance: 0.7 #0.7
    max_cosine_distance: 0.2 # appearance match threshold (lower = stricter)
    nn_budget: 100 # max stored appearance vectors per track (null = unlimited)