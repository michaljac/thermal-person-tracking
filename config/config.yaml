# =============================================================================
# Thermal person tracking — configuration (read by src/detect.py)
# =============================================================================

paths:
  input_video: "videos/input/input_h264.mp4"
  model: "models/best_uav_fast_640x384.onnx" # YOLOv8s, ONNX at 640x384
  output_dir: "videos/output"
  # Other models: "models/best_uav_fast.onnx" (512x512), "models/best_uav_fast.pt",
  #               "models/hae-s-ir_lwir.onnx"

detector:
  # --- YOLO ---
  # With tracker.type "botsort" this is lowered to botsort.track_low_thresh (0.1),
  # because BoT-SORT's second matching stage needs the low-score boxes.
  confidence_threshold: 0.3
  # Static ONNX models must use the exact export size: [height, width].
  # 640x384 keeps the portrait video's aspect ratio (no square padding).
  image_size: [640, 384]
  classes: [0] # person
  device: "cpu"

  # --- HAE-S-IR (used when the model filename contains "hae-s-ir") ---
  hae-s-ir_confidence_threshold: 0.5
  hae-s-ir_image_size: 1024 # longer frame side after resize; null = use hae_scale
  hae_scale: 1.0 # only used when hae-s-ir_image_size is null

preprocessing:
  # none | clahe | inverted | clahe_inverted.  CLAHE tested: recall 0.58 -> 0.30, so off.
  mode: "none"
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: [8, 8]

video:
  default_fps: 30.0 # used if the file reports no FPS
  output_codec: "mp4v"

visualization:
  bbox_thickness: 2
  font_scale: 0.6
  text_thickness: 2

run:
  # Quick test: process only the first `test_num_frames` frames
  # (output name gets "_test<N>"). Set test_mode: false for the whole video.
  test_mode: false
  test_num_frames: 50

profiling:
  enabled: true # per-stage timing report at the end of a run
  warmup_frames: 10 # first frames ignored (model loading makes them slow)

preview:
  # Used only by src/test_detector.py (frame preview grid)
  num_frames: 6
  frames_per_row: 3
  frame_width: 500
  gap: 10
  min_frame_gap: 15

tracker:
  type: "botsort" # botsort (default) | deepsort (previous tracker, for comparison)

  # ---------------------------------------------------------------------------
  # BoT-SORT + re-linking + target selection (see src/trackers/__init__.py)
  # ---------------------------------------------------------------------------
  botsort:
    # Two-stage matching
    track_high_thresh: 0.3 # first-stage matching; also the minimum score drawn
    track_low_thresh: 0.1 # second stage: low scores may only extend existing tracks
    new_track_thresh: 0.5 # minimum score to START a track (0.3 -> 13 IDs, 0.5 -> 9 IDs)
    match_thresh: 0.8 # max IoU cost to accept a match
    fuse_score: true # combine IoU with the detection score
    track_buffer: 90 # frames to keep a lost track (3 s at 30 FPS)

    # Additions for tiny targets
    match_buffer: 1.0 # buffered IoU: boxes enlarged x3 for matching only
    min_hits: 3 # report a track only after 3 matches (like DeepSORT n_init)

    # Camera-motion compensation (the drone moves all the time)
    gmc_method: "sparseOptFlow" # sparseOptFlow | orb | none
    gmc_downscale: 4 # estimate on a 1/4-size frame (2 = Ultralytics default, ~2x slower)

    # Re-link a new track to a recently lost one (bush / detector miss), keeping
    # the old ID. The lost track's "ghost" moves with the camera + its own
    # decaying velocity; distance, direction, size and embedding must agree.
    relink:
      enabled: true
      max_gap_s: 8 # longest gap that can be bridged (bush case in the video: 7.4 s)
      gate_px: 60 # match radius at gap 0 ...
      gate_growth_px_per_s: 120 # ... growing with the gap (uncertainty)
      velocity_decay: 0.97 # per frame; people often stop behind cover
      min_direction_cos: -0.2 # reject candidates clearly behind the walking direction
      direction_weight: 0.5
      max_size_ratio: 2.5 # box area ratio, old vs. new
      appearance: "mobilenet" # mobilenet | none: embedding as a guard against wrong merges
      max_appearance_dist: 0.35 # cosine distance (same person after the bush gap: 0.24)
      appearance_weight: 1.0
      embed_every: 5 # refresh a track's embedding every N frames

      # Target of interest (the walking person) is always shown as ID 1.
      # Score = persistence + near image center + ground speed (each 0..1);
      # a static object far from center scores ~0.7, the walking target ~1.1+.
      target:
        enabled: true
        min_hits: 10 # evidence needed before a track can become the target
        lock_score: 1.0
        min_speed_px_s: 40 # walking threshold (camera motion removed); speed term = 1 at 3x this
        max_speed_px_s: 400 # implausibly fast for a walking person
        # Re-acquisition (target was lost): the candidate must be WALKING;
        # this keeps static hot objects from taking ID 1. If nobody qualifies,
        # ID 1 stays empty instead of going to a guess.
        reacquire_after_s: 3 # before this, the candidate must also be near ...
        gate_px: 150 # ... the target's last IMAGE position (camera follows it),
        gate_growth_px_per_s: 60 # ... within a radius growing with the gap
        max_gap_s: 15 # how long a lost target is remembered
        # Optional hard gate on distance from the image center (0 = center, 1 = edge).
        # Off: during fast pans the real target is at the frame edge (~0.97); a 0.5
        # gate gave its ID 1 away (target got ID 3) while a central bystander took it.
        max_center_dist: null

  # ---------------------------------------------------------------------------
  # DeepSORT (previous tracker: Kalman + MobileNetV2 appearance + IoU)
  # ---------------------------------------------------------------------------
  deepsort:
    max_age: 100 # frames to keep a lost track
    n_init: 3 # matches needed before a track is confirmed
    max_iou_distance: 0.7
    max_cosine_distance: 0.2 # appearance match threshold (lower = stricter)
    nn_budget: 100 # max stored appearance vectors per track (null = unlimited)
