
paths:
  input_video: "videos/input/input_h264.mp4"
  output_video: "videos/output/hae-s-ir_lwir.onnx.mp4"
  model: "models/hae-s-ir_lwir_int8.onnx" #"models/hae-s-ir_lwir.onnx" / "models/best_uav_fast.pt"

detector:
  confidence_threshold: 0.5
  image_size: 512
  classes: [0]
  device: "cpu"

  # hae-s-ir
  hae_scale: 0.5 #1.5



video:
  default_fps: 30.0
  output_codec: "mp4v"

visualization:
  bbox_color: [255, 0, 0]
  bbox_thickness: 2
  font_scale: 0.6
  text_thickness: 2

logging:
  print_every_n_frames: 500

profiling:
  enabled: true
  output_dir: "outputs/profiling"
  warmup_frames: 10
  figure_dpi: 150

preview:
  num_frames: 6
  frames_per_row: 3
  frame_width: 400
  gap: 10